# /etc/nginx/sites-available/ai-agent
#
# Port 443 on this server is already used by another service, so HTTPS is
# served by Nginx on 2053. Cloudflare proxies https://ai.yakoulink.top (443)
# to origin port 2053 through an Origin Rule; visitors never see the port.
# The certificate is issued by Let's Encrypt with:
#   certbot certonly --webroot -w /var/www/certbot -d ai.yakoulink.top

server {
    listen 80;
    listen [::]:80;
    server_name ai.yakoulink.top;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenges (certificate issue and renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 2053 ssl http2;
    listen [::]:2053 ssl http2;
    server_name ai.yakoulink.top;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ai.yakoulink.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.yakoulink.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ai_ssl:10m;
    ssl_session_timeout 1d;

    # Log the visitor's real IP, and refuse connections that bypass Cloudflare.
    include snippets/cloudflare-realip.conf;
    if ($cm_from_cloudflare = 0) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 200m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Access-control layer in front of the application's own BNBU login.
        auth_basic "AI Learning Assistant";
        auth_basic_user_file /etc/nginx/.htpasswd-ai;

        proxy_pass http://127.0.0.1:14242;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
